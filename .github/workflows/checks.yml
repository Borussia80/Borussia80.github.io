name: checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tokens CSS definidos
        run: node tools/check-tokens.mjs
      - name: Casca compartilhada em sincronia
        run: node tools/shell.mjs --check
      - name: Testes das ferramentas
        run: node tests/tool-smoke.cjs
      - name: Compressor de PDF (núcleo)
        run: |
          npm install --no-save --no-package-lock pdf-lib@1.17.1
          node tests/compress-core.test.mjs
      - name: Base de feriados em sincronia com o date-holidays
        run: |
          npm install --no-save --no-package-lock date-holidays@3.39.2
          node tools/build-feriados.mjs --check
      - name: Motor de dias úteis
        run: node tests/dias-uteis.test.mjs
      - name: Matriz de Eisenhower (modelo)
        run: node tests/eisenhower.test.mjs
      - name: Mini-Gantt (núcleo)
        run: node tests/gantt.test.mjs
      - name: Conferência cruzada de feriados (joaopbini/feriados-brasil)
        run: |
          git clone --quiet https://github.com/joaopbini/feriados-brasil /tmp/feriados-ref
          git -C /tmp/feriados-ref checkout --quiet f89f5bd7eac7397b477beb0dd5ce26d5d2449919
          FERIADOS_REF=/tmp/feriados-ref node tests/feriados-cruzado.mjs --check
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0 axe-core@4.14.1 ical.js@2.2.1
          npx playwright install --with-deps chromium
      - name: Dias úteis (ponta a ponta)
        run: SCREENSHOT_DIR=test-results/capturas node tests/dias-uteis.e2e.cjs
      - name: Matriz de Eisenhower (ponta a ponta)
        run: SCREENSHOT_DIR=test-results/capturas node tests/eisenhower.e2e.cjs
      - name: Acessibilidade (axe-core, WCAG 2.1 AA)
        run: node tests/a11y.e2e.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-ferramentas
          path: test-results/capturas
          if-no-files-found: ignore
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lighthouse e Chromium
        run: |
          npm install --no-save --no-package-lock lighthouse@12.8.2 puppeteer-core@24 playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Lighthouse no celular (desempenho ≥ 90, acessibilidade ≥ 95)
        run: LH_SAIDA=test-results/lighthouse node tools/lighthouse.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: test-results/lighthouse
          if-no-files-found: ignore
